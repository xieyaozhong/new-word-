<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04161d">
<title>掌上魚缸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* The phone screen is the tank glass. UI floats on it like frosted labels stuck to the glass. */
  --abyss:#04161d;
  --glass:rgba(6,30,38,.58);
  --glass-strong:rgba(5,24,31,.92);
  --rim:rgba(196,240,228,.18);
  --foam:#ecf8f3;
  --mist:#a3cbc3;
  --coin:#f5c451;
  --kelp:#7fd6a8;
  --coral:#ff8b74;
  --male:#7cc4ff;
  --female:#ff9ec0;
  --font:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--foam);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#hud,#dock,#sheet,#edtools,.modal,.photo,button,a{touch-action:manipulation}
#tank{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.m{color:var(--male)} .f{color:var(--female)}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px)}
.purse{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.coins{display:inline-flex;align-items:center;gap:7px;padding:4px 14px 4px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--rim);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.coins .ico{width:28px;height:28px}
.coins.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.08)}}
.qpill{pointer-events:auto;position:relative;margin-left:2px;border:1px solid var(--rim);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--foam);font-size:12.5px;padding:4px 11px;border-radius:999px;cursor:pointer}
.qpill.ready{border-color:rgba(245,196,81,.6);color:var(--coin)}
.qpill.ready::after{content:'';position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px rgba(6,30,38,.9)}
.hearts{color:#ff8fa8;font-size:15px;letter-spacing:1px;margin:2px 0 4px}
.ldays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 8px}
.lday{border-radius:10px;padding:5px 2px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:1px}
.lday small{font-size:10px;color:var(--mist)}
.lday b{font-size:12.5px;color:var(--coin)}
.lday.got{opacity:.45}
.lday.now{border-color:var(--coin);background:rgba(245,196,81,.14)}
#mini{position:fixed;inset:0;z-index:40;background:#0e4a72}
#miniCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.mhud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:16px;background:rgba(6,30,38,.62);color:#fff;font-size:15px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mhud b{color:var(--coin);font-variant-numeric:tabular-nums}
.mbar{display:inline-block;width:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;vertical-align:middle}
.mbar i{display:block;height:100%;width:100%;background:#7fd6a8}
.mhud button{border:0;border-radius:10px;padding:6px 12px;background:rgba(255,255,255,.16);color:#fff;font:inherit;cursor:pointer}
.mtip{position:absolute;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom) + 28px);text-align:center;color:rgba(255,255,255,.92);font-size:14.5px;line-height:1.5;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.evcard{margin:0 4px 10px;padding:11px 13px;border-radius:16px;background:rgba(111,195,255,.1);border:1px solid rgba(111,195,255,.28)}
.evcard.fest{background:rgba(255,139,116,.12);border-color:rgba(255,139,116,.35)}
.evcard.hurt{background:rgba(255,110,100,.1);border-color:rgba(255,110,100,.38)}
.qpill.inj{display:block;margin-top:5px;border-color:rgba(255,110,100,.65);color:#ffb4a8}
.qpill.inj[hidden]{display:none}
.kboard{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--rim);margin:6px 0 10px}
.khead{display:flex;gap:10px;align-items:center;margin-bottom:4px}.khead b{display:block;font-size:15px}.khead small{display:block;color:var(--mist);font-size:12.5px}
.kemo{font-size:28px;width:54px;text-align:center;flex:none;line-height:1}
.kstep{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.kstep>div{flex:1;min-width:0}.kstep b{display:block;font-size:14px}.kstep small{display:block;font-size:12px;color:var(--mist);line-height:1.5}
.kstep .kmeta{color:#bfe0d8}.kstep .kmeta.hi{color:#ffa07a}.kstep.done b{color:#8ad8a8}
.kboard .btn{margin-top:8px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.ktool{padding:6px 4px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center;opacity:.42;cursor:pointer}.ktool.on{opacity:1;background:rgba(138,216,168,.08)}
.ktool canvas{width:100%;height:auto;display:block}.ktool b{display:block;font-size:12.5px}.ktool small{font-size:11px;color:var(--mist)}
#ghost{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(12,8,30,.6)}
#ghost.on{display:flex}
#ghost.mini{background:transparent;align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 150px)}
#ghost .gbox{max-width:340px;width:100%;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(200,190,255,.35);border-radius:20px;padding:18px;text-align:center}
#ghost.mini .gbox{padding:0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
#ghost.mini .gfull,#ghost .gmini{display:none}#ghost.mini .gmini{display:inline-block}
#ghost h3{margin:6px 0;font-size:20px}#ghost p{font-size:14px;line-height:1.65;margin:6px 0}#ghost .sub{color:var(--mist);font-size:12.5px}
#ghost .btn{width:100%;margin-top:8px}
#ghost .gh{font-size:52px;animation:ghf 2.6s ease-in-out infinite}
@keyframes ghf{50%{transform:translateY(-9px) rotate(-4deg)}}
.gmini{border:1px solid rgba(200,190,255,.5);background:var(--glass-strong);color:#e4ddff;border-radius:999px;padding:8px 16px;font-size:13.5px;cursor:pointer}
body.dead #tank{filter:grayscale(.85) brightness(.8)}
.evcard.season.spring{background:rgba(255,176,204,.1);border-color:rgba(255,176,204,.32)}.evcard.season.summer{background:rgba(255,214,90,.09);border-color:rgba(255,214,90,.3)}.evcard.season.autumn{background:rgba(232,128,58,.1);border-color:rgba(232,128,58,.32)}.evcard.season.winter{background:rgba(168,216,255,.1);border-color:rgba(168,216,255,.32)}
.evcard h3{margin:0 0 3px;font-size:16px}
.evcard p{margin:0 0 6px;font-size:13px;color:var(--mist);line-height:1.5}
.evcard p:last-child{margin-bottom:0}
h4.sec{margin:14px 6px 4px;font-size:14px;color:var(--kelp);font-weight:700}
.quest{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid rgba(255,255,255,.07)}
.quest b{font-size:15px;display:block}
.quest small{font-size:12px;color:var(--mist)}
.qbar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin:5px 0 3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--kelp);border-radius:3px}
.quest.bonus{background:rgba(245,196,81,.08);border-radius:14px;border-top:0;margin-top:4px;padding:10px}
.req{margin:6px 2px 10px;padding:10px 10px 4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.req h4{margin:0 0 6px;font-size:15px}
.req .sub{margin:0 0 6px;font-size:12.5px;color:var(--mist)}
.srow{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)}
.srow canvas{width:54px;height:36px;display:block}
.srow div{font-size:14px;line-height:1.35}
.srow small{display:block;font-size:12px;color:var(--mist)}
.emap{display:block;width:100%;height:310px;border-radius:18px;margin:0 0 4px;touch-action:manipulation;cursor:pointer}
.trmsg{margin:2px 6px 10px;padding:9px 11px;border-radius:12px;background:rgba(255,200,90,.13);border:1px solid rgba(255,200,90,.28);color:var(--foam);font-size:13px;line-height:1.5}
.trnote{margin:6px 6px 10px;font-size:13px;line-height:1.55;color:var(--mist)}
.trsell{margin:0 2px 12px;padding:10px 10px 12px}
.trsell h4,.trbox h4{margin:10px 4px 4px;font-size:14px}
.trrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.trrow .regin{margin:0;flex:1;min-width:0}
.trcode{width:100%;min-height:84px;box-sizing:border-box;border-radius:12px;border:1px solid var(--rim);background:rgba(255,255,255,.06);color:var(--foam);font:12px/1.45 ui-monospace,Menlo,monospace;padding:8px 10px;word-break:break-all;resize:vertical}
.trqr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 12px;padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.trqr canvas{border-radius:10px;background:#fff;max-width:78vw;height:auto!important}
.trqr p{margin:0;font-size:13px;line-height:1.5;color:var(--mist);text-align:center}
.trbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#scanOv{position:fixed;inset:0;z-index:80;background:rgba(3,12,18,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));color:var(--foam);text-align:center}
#scanOv h3{margin:0;font-size:19px}
#scanOv p{margin:0;max-width:340px;font-size:14px;line-height:1.6;color:var(--mist)}
#scanOv .vbox{position:relative;width:min(78vw,320px);aspect-ratio:1;border-radius:20px;overflow:hidden;background:#000}
#scanOv video{width:100%;height:100%;object-fit:cover;display:block}
#scanOv .frame{position:absolute;inset:14%;border:3px solid rgba(255,214,102,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.trpid{font:700 24px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;color:var(--coin)}
.trpick{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px 84px}
.trsel{width:100%;box-sizing:border-box;padding:9px 10px;border-radius:12px;border:1px solid var(--rim);background:#123844;color:var(--foam);font:inherit;font-size:15px}
.regin{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--rim);background:rgba(255,255,255,.08);color:var(--foam);font:inherit;font-size:16px;margin:8px 0}
.regin::placeholder{color:rgba(236,248,243,.45)}
.regrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 8px;font-size:14.5px}
.linkbtn{border:1px solid var(--rim);background:rgba(255,255,255,.06);color:var(--foam);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.mapnote{font-size:11.5px;color:var(--mist);margin:0 4px 8px;text-align:center;line-height:1.5}
.site h3{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.site .meta2{font-size:12.5px;color:var(--foam);margin:2px 0 6px}
.risk{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:400}
.risk.lo{background:rgba(127,214,168,.18);color:var(--kelp)}
.risk.mid{background:rgba(245,196,81,.18);color:var(--coin)}
.risk.hi{background:rgba(255,139,116,.2);color:var(--coral)}
.siterow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 8px;border:0;border-top:1px solid rgba(255,255,255,.07);background:none;color:inherit;font:inherit;font-size:14.5px;cursor:pointer}
.siterow.on{background:rgba(255,255,255,.07);border-radius:12px}
.siterow i{width:10px;height:10px;border-radius:50%;display:block}
.siterow small{font-size:12px;color:var(--mist)}
.tbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--coin);border-radius:3px}
.logl{margin:0;padding:6px 6px;font-size:12.5px;color:var(--mist);line-height:1.5;border-top:1px solid rgba(255,255,255,.06)}
.meta{font-size:12.5px;color:var(--foam);opacity:.82;padding-left:8px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.right{display:flex;gap:8px;align-items:flex-start}
.gauges{display:flex;flex-direction:column;gap:6px;padding:8px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--rim);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);min-width:104px}
.gauge{display:flex;flex-direction:column;gap:3px}
.gauge b{font-weight:400;font-size:12px;color:var(--mist);display:flex;justify-content:space-between;gap:8px}
.gauge b span{color:var(--foam)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--kelp);transition:width .6s ease,background-color .6s}
.strip{height:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.strip i{border-radius:1px;opacity:.22;transition:opacity .6s}
.strip i.on{opacity:1}
.lamp{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:1px solid var(--rim);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;color:var(--mist)}
.lamp[aria-pressed="true"]{color:var(--coin);background:rgba(245,196,81,.16)}
.btns{display:flex;flex-direction:column;gap:8px}
#foodBtn{position:relative}
.fbadge{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#0d2230;border:1px solid var(--rim);font:600 11px/16px system-ui,sans-serif;color:var(--foam);text-align:center}
.fbadge[hidden]{display:none}
.meta.cold{color:#a8dcff}
.meta.hot{color:#ffb08a}
.opick{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 10px}
.chipbtn{border:1px solid var(--rim);background:rgba(255,255,255,.08);color:var(--foam);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.item .opick{padding:6px 0 0}
.item .chipbtn{padding:4px 9px;font-size:12px}
.fac{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);margin:8px 0}
.fhead{display:flex;justify-content:space-between;align-items:baseline}
.ftier{font-weight:700;font-size:13px}
.fbar{position:relative;height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin:7px 0}
.fbar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.45)}
.fbar>i{position:absolute;top:0;bottom:0;border-radius:4px}
.fac small{display:block;color:var(--mist);font-size:12px;line-height:1.55}
.story{padding:12px;border-radius:16px;background:rgba(255,255,255,.06);margin:10px 0}
.story.done{opacity:.88}
.shead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.sav{width:56px;height:56px;border-radius:50%;flex:none}
.shead b{display:block;font-size:16px}
.shead small{color:var(--mist);font-size:12px;line-height:1.4}
.story h5{margin:8px 0 2px;font-size:14px;color:var(--coin)}
.story .say{margin:4px 0;font-size:14px;line-height:1.65}
.story .goal{margin:6px 0;font-size:13px;color:var(--mist)}
.story .goal.ok{color:#8ad8a8}
.story .goal.no{color:#ffa07a}
.story.here{background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.25)}
.story .when{margin:6px 0 2px;font-size:13px;color:var(--mist)}
.story .when.now{color:var(--coin);font-weight:600}
.story .btn{margin:6px 6px 0 0}
.rbars{margin:8px 0 4px}
.rbar{display:grid;grid-template-columns:5.2em 1fr 3.4em;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.rbar>i{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.rbar>i>i{display:block;height:100%;background:var(--coin)}
.rbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.mtip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(6,30,38,.6);color:#fff;font-size:15px;white-space:nowrap;pointer-events:none}
.mtip.hot{background:#e8402a;font-weight:700}
.mtip.warn{background:#b8541a;font-weight:700}
.mtip.mlong{white-space:normal;width:min(86vw,360px);border-radius:16px;line-height:1.6;text-align:center;font-size:14px;padding:10px 14px}
.msetup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,18,22,.72);z-index:3}
.msin{width:min(92vw,380px);max-height:82vh;overflow:auto;padding:16px 16px 18px;border-radius:20px;background:#0f3640;border:1px solid var(--rim);color:var(--foam);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.msin h3{margin:0 0 4px;font-size:18px}.msin h4{margin:12px 0 0;font-size:14px;color:var(--coin)}.msin p{margin:0;font-size:13px;line-height:1.55;color:var(--mist)}.msin .opick{padding:6px 0 4px}.msin .btn{width:100%;margin-top:14px}
.msdesc{min-height:2.9em}
.mbtns{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;gap:8px;z-index:2}
.mbtns button{border:0;border-radius:12px;padding:10px 14px;background:rgba(6,30,38,.78);color:#fff;font:inherit;font-size:14px;cursor:pointer}
.mhud{gap:8px;z-index:5}
.jiao{display:block;width:100%;max-width:300px;height:auto;margin:4px auto 6px}
.drow{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;line-height:1.5}
.drow time{flex:none;color:var(--mist);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.chipbtn.on{background:var(--coin);color:#3a2604;border-color:transparent;font-weight:700}
.photo{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(2,10,14,.85);padding:18px}
.photo.on{display:grid}
.photo.on::after{content:'';position:fixed;inset:0;background:#fff;pointer-events:none;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.pcard{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}
.pcard img{max-width:100%;max-height:68vh;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pcard p{margin:0;font-size:13px;color:var(--mist)}
.pcard a.btn{text-decoration:none}

/* Dock */
#dock{position:fixed;z-index:5;left:calc(env(safe-area-inset-left) + 12px);right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 10px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.hint{font-size:14px;min-height:1.3em;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.dock-row{pointer-events:auto;width:100%;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:22px;
  background:var(--glass);border:1px solid var(--rim);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:7px 0 6px;border-radius:16px;font-size:13.5px;cursor:pointer}
.dock-btn:active{background:rgba(255,255,255,.1)}
.dock-btn{position:relative}
.dock-btn.visit::after{content:'';position:absolute;top:4px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:var(--coin);box-shadow:0 0 0 2px rgba(6,30,38,.9),0 0 10px rgba(245,196,81,.9)}
.dock-btn.new::after{content:'';position:absolute;top:5px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px rgba(6,30,38,.9)}
.mode-row{pointer-events:auto;width:100%;max-width:460px;display:none;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:22px;background:var(--glass-strong);border:1px solid var(--rim)}
.mode-row p{margin:0;flex:1;font-size:15px;line-height:1.35}
.mode-row small{display:block;color:var(--mist);font-size:12.5px}
body.mode-clean .dock-row,body.mode-edit .dock-row{display:none}
body.mode-clean .mode-row,body.mode-edit .mode-row{display:flex}
.btn{border:0;border-radius:14px;padding:10px 18px;font-size:15px;cursor:pointer;background:var(--coin);color:#3a2604;font-weight:700}
.btn:disabled{background:rgba(255,255,255,.1);color:var(--mist);cursor:default}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--foam);font-weight:400}

/* Sheet */
#scrim{position:fixed;inset:0;z-index:8;background:rgba(2,10,14,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0 auto;max-width:560px;max-height:80%;display:flex;flex-direction:column;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--rim);border-bottom:0;border-radius:24px 24px 0 0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
#sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grip{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:8px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;flex:none}
.sheet-head h2{margin:0;font-size:23px;font-weight:700;letter-spacing:.05em}
.x{border:0;background:rgba(255,255,255,.08);border-radius:12px;padding:7px 13px;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:5px;padding:0 14px 10px;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs[hidden]{display:none}
.tab{border:1px solid var(--rim);background:none;border-radius:999px;padding:6px 11px;font-size:14px;flex:none;cursor:pointer;color:var(--mist);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--foam);color:var(--abyss);border-color:var(--foam)}
.sheet-body{overflow-y:auto;padding:0 14px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;min-height:0}
.wallet{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:2px 6px 8px;font-size:14px;color:var(--mist)}
.wallet .ico{width:16px;height:16px}
.wallet b{color:var(--coin);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:11px 6px;border-top:1px solid rgba(255,255,255,.07)}
.thumb{width:72px;height:48px;border-radius:12px;background:linear-gradient(#2c8fa1,#0f4a5c);display:block}
.item h3{margin:0 0 3px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.item p{margin:0;font-size:13px;color:var(--mist);line-height:1.45}
.item .sub{margin-top:2px;font-size:12px;opacity:.85}
.tag{font-size:11px;font-weight:400;padding:1px 7px;border-radius:999px;background:rgba(127,214,168,.16);color:var(--kelp)}
.tag.sale{background:rgba(255,139,116,.2);color:var(--coral)}
.restock{margin:0 6px 8px;padding:9px 12px;border-radius:14px;background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.25);font-size:13.5px;line-height:1.5}
.restock b{color:var(--coin);font-weight:400;font-variant-numeric:tabular-nums}
.item s{opacity:.7}
.npc{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:10px 12px;margin:0 2px 6px;border-radius:18px;background:linear-gradient(135deg,rgba(245,196,81,.16),rgba(255,255,255,.03));border:1px solid rgba(245,196,81,.32)}
.npc canvas{width:72px;height:72px;border-radius:50%;display:block}
.npc h3{margin:0 0 3px;font-size:18px;display:flex;gap:6px;align-items:center}
.npc .say{margin:0 0 4px;font-size:14px;line-height:1.5}
.npc .sub{margin:0;font-size:12.5px;color:var(--mist)}
.npc .sub b{color:var(--coin);font-weight:400;font-variant-numeric:tabular-nums}
.conds{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:12.5px;line-height:1.45}
.ok{color:var(--kelp)} .no{color:var(--coral)}
.trait{margin:0;font-size:12.5px;line-height:1.45;color:#ffc2ad}
.npc.alien{background:linear-gradient(135deg,rgba(150,90,255,.26),rgba(60,220,255,.08));border-color:rgba(180,130,255,.55)}
.npc.alien .tag.sp{background:rgba(180,130,255,.25);color:#e6d2ff}
.tag.sp{background:rgba(245,196,81,.18);color:var(--coin)}
.rtag{font-size:11.5px;font-weight:400;padding:0 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.buy{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-radius:12px;padding:9px 10px;min-width:74px;background:var(--coin);color:#3a2604;font-weight:700;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.buy .ico{width:16px;height:16px}
.buy:disabled{background:rgba(255,255,255,.1);color:var(--mist);cursor:default}
.pack{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 6px;border-top:1px solid rgba(255,255,255,.07)}
.pack canvas{width:76px;height:76px;display:block}
.pack h3{margin:0 0 3px;font-size:18px;font-weight:700}
.pack p{margin:0;font-size:13px;color:var(--mist);line-height:1.45}
.odds{font-size:12px!important;margin-top:5px!important;opacity:.9}

/* Fish card */
.fcard{display:flex;flex-direction:column;gap:12px;padding:0 4px}
.portrait{width:100%;height:150px;border-radius:18px;display:block}
.namebox input{width:100%;font:inherit;font-size:22px;font-weight:700;color:var(--foam);background:rgba(255,255,255,.06);border:1px solid var(--rim);border-radius:12px;padding:8px 12px;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--mist)}
.chip.m{color:var(--male)} .chip.f{color:var(--female)}
.chip.gene{color:var(--coin);background:rgba(245,196,81,.12);border:1px solid rgba(245,196,81,.35)}
.gtag{font-size:11px;font-weight:400;padding:0 6px;border-radius:999px;background:rgba(245,196,81,.14);color:var(--coin);line-height:1.6}
.stat{display:grid;grid-template-columns:40px 1fr 70px;align-items:center;gap:10px;font-size:14px}
.stat .bar{height:8px;border-radius:4px}
.stat span:last-child{text-align:right;color:var(--mist);font-size:13px}
.fnote{margin:0;font-size:13px;color:var(--mist);line-height:1.55}
.breed{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--rim)}
.breed h4{margin:0;font-size:15px}
.breed p{margin:0;font-size:13.5px;line-height:1.5;color:var(--mist)}
.breed .btn{align-self:flex-start;padding:8px 16px;font-size:14px}
.prow{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:0;width:100%;text-align:left;cursor:pointer}
.prow canvas{width:54px;height:36px;border-radius:8px;background:linear-gradient(#2c8fa1,#0f4a5c);display:block}
.prow small{display:block;color:var(--mist);font-size:12px}
.prow em{font-style:normal;font-size:12.5px;color:var(--coin)}
.rehome{align-self:flex-start;border:1px solid var(--rim);background:none;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mist);cursor:pointer}
.rehome.armed{border-color:var(--coral);color:var(--coral)}

/* Lists */
.sec{margin:6px 6px 4px;font-size:13px;color:var(--mist)}
.frow{display:grid;grid-template-columns:60px 1fr 64px;gap:12px;align-items:center;width:100%;padding:9px 6px;border:0;border-top:1px solid rgba(255,255,255,.07);background:none;text-align:left;cursor:pointer}
.frow canvas{width:60px;height:40px;border-radius:10px;background:linear-gradient(#2c8fa1,#0f4a5c);display:block}
.frow b{font-size:16px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.frow small{color:var(--mist);font-size:12.5px}
.frow .bar{height:6px}
.frow .inv{font-size:12px;color:var(--mist);text-align:right}
.egg{display:flex;justify-content:space-between;gap:10px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.07);font-size:14px}
.egg span:last-child{color:var(--coin);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{padding:14px 6px 4px;font-size:12.5px;color:var(--mist);line-height:1.7;border-top:1px solid rgba(255,255,255,.07)}
.foot b{font-weight:400;color:var(--foam)}
.switch{border:1px solid var(--rim);background:none;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--foam);cursor:pointer;margin-left:4px}
.switch[aria-pressed="true"]{background:rgba(127,214,168,.18);border-color:var(--kelp)}
.dexhead{padding:2px 6px 10px;font-size:13.5px;color:var(--mist)}
.dexhead b{color:var(--foam);font-weight:400}
.dexgrp{margin:12px 6px 6px;font-size:14px}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 2px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);text-align:center;cursor:pointer}
.dcell canvas{width:100%;max-width:100px;height:58px;border-radius:10px;background:linear-gradient(#2c8fa1,#0f4a5c);display:block}
.dcell b{font-size:14px}
.dcell small{font-size:11.5px;color:var(--mist)}
.dots{display:flex;gap:3px;height:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12)}

/* Modals, toast, edit tools */
.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(2,10,14,.5);padding:24px}
.modal.on{display:grid}
.mcard{width:min(350px,100%);background:var(--glass-strong);border:1px solid var(--rim);border-radius:24px;padding:22px 22px 18px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.mcard h2{margin:0 0 8px;font-size:24px;text-wrap:balance}
.mcard p{margin:0 0 14px;color:var(--mist);font-size:15px;line-height:1.65}
.mcoins{display:flex;align-items:center;justify-content:center;gap:8px;font-size:34px;font-weight:700;color:var(--coin);margin:0 0 16px;font-variant-numeric:tabular-nums}
.mcoins .ico{width:34px;height:34px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.gcard{padding:14px 14px 18px}
.gcard canvas{width:100%;height:220px;display:block;border-radius:18px;margin-bottom:12px;cursor:pointer}
.gtext{transition:opacity .35s}
.gcard.hide .gtext{opacity:0;pointer-events:none}
.rarity{display:inline-block;font-size:13px;padding:2px 12px;border-radius:999px;border:1px solid currentColor;margin-bottom:8px}
.gbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);z-index:22;transform:translate(-50%,-8px);padding:8px 16px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--rim);
  font-size:14.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#edtools{position:fixed;z-index:6;display:none;gap:6px;padding:5px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--rim)}
#edtools.on{display:flex;align-items:center}
#edInfo{font-size:12px;color:var(--mist);padding:0 4px;white-space:nowrap}
#edInfo:empty{display:none}
#edtools button{border:0;background:rgba(255,255,255,.09);border-radius:10px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function dailyStock(){

  const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Saving: this browser first, the viewer's own private db doc when available ---------- */
let saveMode = 'memory', docRef = null, cloudTimer = 0, writing = false, writeAgain = false, dirty = false, cloudDone = false, pendingWelcome = null, retried = false;

function markDirty(){ dirty = true; if (!cloudTimer) cloudTimer = setTimeout(saveNow, 1500); }
function saveNow(){
  clearTimeout(cloudTimer); cloudTimer = 0; if (!dirty) return; dirty = false;
  serialize(); state.savedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); if (saveMode === 'memory') saveMode = 'local'; } catch (_) {}
  writeCloud();
}
async function writeCloud(){
  if (!docRef) return;
  if (writing) { writeAgain = true; return; }
  writing = true;
  try { await docRef.set(JSON.parse(JSON.stringify(state))); saveMode = 'cloud'; retried = false; }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' && !retried) { retried = true; setTimeout(writeCloud, 1500 + Math.random() * 2000); }
    else if (code !== 'resource_exhausted' && code !== 'unavailable') { docRef = null; if (saveMode === 'cloud') saveMode = 'local'; }
  }
  writing = false;
  if (writeAgain) { writeAgain = false; writeCloud(); }
}
function loadLocal(){ try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && s.v) { saveMode = 'local'; return s; } } catch (_) {} return null; }

async function connectCloud(){
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { finishCloud(); return; }
  const timer = setTimeout(finishCloud, 10000);
  try {
    const [user, db] = await Promise.all([cl.use('user'), cl.use('db')]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/tank');
    const snap = await ref.get();
    docRef = ref;
    if (snap.exists) {
      const remote = snap.data();
      if (remote && remote.v && (+remote.savedAt || 0) > (state.savedAt || 0)) {
        state = migrate(JSON.parse(JSON.stringify(remote))); applyRegion(state.region);
        initRuntime();
        pendingWelcome = catchUp(Date.now());
        saveMode = 'cloud';
        return;
      }
    }
    saveMode = 'cloud'; dirty = true; saveNow();
  } catch (_) { /* keep playing on this device */ }
  finally { clearTimeout(timer); finishCloud(); }
}

  if (d.box) return '在隔離盒裡，先放出來'; if (d.ich) return '生病了，治好才能交易';
